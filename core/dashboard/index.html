<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI-teammates</title>
<!-- Served by .ai-teammates/hooks/dashboard_server.py, which computes every panel's data live from
     the same sources the guardrails read (git, board.json, the agent specs, config.json, the event
     log). No external requests: it runs on localhost and shows your project's state. -->
<style>
  :root{
    --fg:#1A1A1A; --muted:rgba(26,26,26,.52);
    --core:#D8482A; --gold:#C97A1B; --halo:#6BB6FF; --ok:#2E8B57;
    --border:rgba(26,26,26,.13); --card:rgba(255,255,255,.72);
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:26px 30px 60px;font-family:var(--sans);color:var(--fg);
       background:linear-gradient(135deg,#FFF8F0,#FFEFE0 45%,#FFF3E8);
       min-height:100vh;font-size:14px}
  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  h1{font-family:var(--mono);font-size:.95rem;letter-spacing:.16em;
     text-transform:uppercase;margin:0}
  .meta{color:var(--muted);font-size:.76rem}
  .live{display:inline-block;width:7px;height:7px;border-radius:50%;
        background:var(--ok);margin-right:6px;animation:p 2.4s infinite}
  @keyframes p{0%,100%{opacity:1}50%{opacity:.25}}

  nav{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
  nav button{font-family:var(--mono);font-size:.72rem;letter-spacing:.09em;
    text-transform:uppercase;padding:8px 15px;border-radius:999px;cursor:pointer;
    border:1px solid var(--border);background:rgba(255,255,255,.5);color:var(--fg);
    transition:.15s}
  nav button:hover{border-color:var(--core)}
  nav button.on{background:var(--core);border-color:var(--core);color:#fff}

  .panel{display:none} .panel.on{display:block}

  /* board */
  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start}
  .col{background:rgba(255,255,255,.4);border:1px solid var(--border);
       border-radius:14px;padding:12px;min-height:120px}
  .col h2{font-family:var(--mono);font-size:.68rem;letter-spacing:.12em;
     text-transform:uppercase;color:var(--muted);margin:0 0 12px;
     display:flex;justify-content:space-between}
  .card{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--core);
        border-radius:11px;padding:11px 12px;margin-bottom:10px}
  .card:last-child{margin-bottom:0}
  .card .id{font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;color:var(--muted)}
  .card .ttl{font-weight:600;margin:3px 0 6px;line-height:1.35;font-size:.87rem}
  .card .note{color:var(--muted);font-size:.77rem;line-height:1.55}
  .who{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);
       font-size:.64rem;padding:2px 8px;border-radius:999px;border:1px solid var(--border);
       margin-top:8px}
  .dot{width:6px;height:6px;border-radius:50%;flex:none}

  /* team */
  .org{display:flex;flex-direction:column;gap:12px;max-width:820px}
  .node{background:var(--card);border:1px solid var(--border);border-radius:13px;
        padding:13px 15px;display:flex;gap:13px;align-items:flex-start}
  .node .nm{font-family:var(--mono);font-size:.8rem;font-weight:500}
  .node .rl{color:var(--muted);font-size:.8rem;margin-top:3px;line-height:1.5}
  .node .load{margin-left:auto;font-family:var(--mono);font-size:.66rem;
               color:var(--muted);white-space:nowrap}

  /* rules */
  .rules{max-width:880px}
  .rule{background:var(--card);border:1px solid var(--border);border-radius:13px;
        padding:14px 16px;margin-bottom:11px}
  .rule h3{font-family:var(--mono);font-size:.72rem;letter-spacing:.09em;
     text-transform:uppercase;margin:0 0 9px;color:var(--core)}
  .rule ul{margin:0;padding-left:17px} .rule li{margin:5px 0;line-height:1.6}
  .rule code, td code{font-family:var(--mono);font-size:.8rem;background:rgba(26,26,26,.06);
             padding:1px 5px;border-radius:4px}
  .warn{border-left:3px solid var(--gold)}
  .enforced{border-left:3px solid var(--ok)}

  /* tables: branches, activity */
  table{width:100%;border-collapse:collapse;background:var(--card);
        border:1px solid var(--border);border-radius:13px;overflow:hidden}
  th{font-family:var(--mono);font-size:.6rem;letter-spacing:.11em;text-transform:uppercase;
     color:var(--muted);text-align:left;padding:9px 12px;border-bottom:1px solid var(--border)}
  td{padding:8px 12px;font-size:.81rem;border-bottom:1px solid rgba(26,26,26,.05)}
  tr:last-child td{border-bottom:none}
  .t{font-family:var(--mono);font-size:.7rem;color:var(--muted);white-space:nowrap}
  .blocked{color:var(--core);font-weight:600}
  .override{color:var(--gold);font-weight:600}
  .empty{padding:30px;text-align:center;color:var(--muted)}
  .gitnow{font-family:var(--mono);font-size:.72rem;padding:3px 9px;border-radius:999px;
    border:1px solid var(--border);background:rgba(255,255,255,.5);margin-left:10px}
  .memstale{border-color:var(--gold);color:var(--gold);background:rgba(201,122,27,.10)}
  #gitBody h3{font-family:var(--mono);font-size:.8rem;margin:0 0 8px;font-weight:600}
  @media(max-width:1000px){.board{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header>
  <h1 id="title">AI-teammates</h1>
  <span class="meta">
    <span class="live"></span><span id="status">loading…</span>
    <!-- Always visible, every tab: which branch is under you right now. -->
    <span id="gitNow" class="gitnow" title="current branch / branches / worktrees">—</span>
    <span id="memHealth" class="gitnow" title="memory freshness">memory: …</span>
  </span>
</header>

<nav>
  <button class="on" data-p="board">Board</button>
  <button data-p="git">Branches</button>
  <button data-p="team">Team</button>
  <button data-p="rules">Rules &amp; Guardrails</button>
  <button data-p="activity">Activity</button>
</nav>

<div class="panel on" id="board"><div class="board" id="cols"></div></div>
<div class="panel" id="git">
  <div class="rules" id="gitBody"><div class="empty">loading git state…</div></div>
</div>
<div class="panel" id="team"><div class="org" id="org"></div></div>
<div class="panel" id="rules"><div class="rules" id="rulesBody"></div></div>
<div class="panel" id="activity">
  <table><thead><tr><th>When</th><th>Agent</th><th>Action</th><th>Target</th></tr></thead>
  <tbody id="rows"><tr><td colspan="4" class="empty">No events yet.</td></tr></tbody></table>
</div>

<script>
const esc=s=>String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const ago=iso=>{const s=Math.max(0,(Date.now()-new Date(iso).getTime())/1000);
  return s<60?Math.floor(s)+"s":s<3600?Math.floor(s/60)+"m":s<86400?Math.floor(s/3600)+"h":Math.floor(s/86400)+"d";};

// ── Tabs: #team, #rules ... in the address open that tab directly ────────
function show(p){
  if(!document.getElementById(p)) return;
  document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on", x.dataset.p===p));
  document.querySelectorAll(".panel").forEach(x=>x.classList.toggle("on", x.id===p));
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{ show(b.dataset.p); history.replaceState(null,"","#"+b.dataset.p); });
if(location.hash) show(location.hash.slice(1));
window.addEventListener("hashchange", ()=>show(location.hash.slice(1)));   // a changed #tab does not reload the page

// ── Branches & worktrees ─────────────────────────────────────────────
// /git.json is computed per request by dashboard_server.py. A file on disk
// would go stale the moment anything is checked out, and a stale branch
// indicator is worse than none because it gets believed.
async function renderGit(){
  let g; try{ g=await (await fetch("git.json?_="+Date.now())).json(); }
  catch{
    document.getElementById("gitNow").textContent="git: not reachable";
    document.getElementById("gitBody").innerHTML=
      "<div class='empty'>/git.json not reachable: start the dashboard with "
      +"python3 .ai-teammates/hooks/dashboard_server.py</div>";
    return;
  }
  if(g.error){ document.getElementById("gitBody").innerHTML="<div class='empty'>"+esc(g.error)+"</div>"; return; }
  const prod=esc(g.production||"main");

  document.getElementById("gitNow").innerHTML=
    "<b>"+esc(g.current)+"</b> · "+g.counts.branches+" branches"
    +(g.counts.remoteOnly?" · <span class='override'>"+g.counts.remoteOnly+" remote-only</span>":"")
    +" · "+g.counts.worktrees+" worktrees"
    +(g.dirty?" · <span class='override'>"+g.dirty+" dirty</span>":"");

  const wt=g.worktrees.map(w=>
    "<tr><td class='t'>"+esc(w.name)+"</td><td>"+esc(w.branch||"(detached)")
    +(w.branch===g.current?" <span class='blocked'>← you are here</span>":"")
    +"</td><td class='t'>"+esc(w.path)+"</td></tr>").join("");

  const br=g.branches.map(b=>{
    const state=b.ahead===0?"<span class='t'>merged</span>"
      :"<span class='override'>"+b.ahead+" unmerged</span>";
    return "<tr><td>"+esc(b.name)+(b.checkedOut?" <span class='t'>[checked out]</span>":"")
      +(b.remote?" <span class='override'>[remote only]</span>":"")
      +"</td><td>"+state+"</td><td class='t'>"+(b.behind?b.behind+" behind "+prod:"—")
      +"</td><td class='t'>"+esc(b.last)+"</td></tr>";
  }).join("");

  document.getElementById("gitBody").innerHTML=
    "<h3>Worktrees <span class='t'>("+g.counts.worktrees+")</span></h3>"
    +"<table><thead><tr><th>Folder</th><th>Branch</th><th>Path</th></tr></thead><tbody>"+wt+"</tbody></table>"
    +"<h3 style='margin-top:22px'>Branches <span class='t'>("+g.counts.branches
    +(g.counts.remoteOnly?" + "+g.counts.remoteOnly+" remote-only":"")
    +") — unmerged means it has commits "+prod+" does not"
    +(g.fetchedAt?"; remotes as of last fetch, "+Math.round((Date.now()/1000-g.fetchedAt)/60)+" min ago":"; remotes never fetched")
    +"</span></h3>"
    +"<table><thead><tr><th>Branch</th><th>vs "+prod+"</th><th>Behind</th><th>Last commit</th></tr></thead><tbody>"+br+"</tbody></table>"
    +(g.dirty?"<h3 style='margin-top:22px'>Uncommitted here <span class='t'>("+g.dirty+")</span></h3><div class='t' style='padding:8px 0'>"
      +g.dirtyFiles.map(esc).join("<br>")+"</div>":"");
}
renderGit(); setInterval(renderGit, 15000);

// ── Memory health ────────────────────────────────────────────────────
// The failure here is silence, not errors: a capture script once looked installed and
// wrote nothing for nine days. So staleness is shown in the header where it
// cannot be missed, not buried behind a tab.
async function renderHealth(){
  let h; try{ h=await (await fetch("health.json?_="+Date.now())).json(); }catch{ return; }
  const el=document.getElementById("memHealth"); if(!el||h.error) return;
  const bad=h.checks.filter(c=>c.stale);
  el.className="gitnow"+(bad.length?" memstale":"");
  el.title=h.checks.map(c=>c.check+": "+(c.why||(c.days===null?"never":c.days+"d"))).join("\n");
  el.innerHTML = bad.length
    ? "memory: <b>"+bad.length+" stale</b> — "+esc(bad.map(c=>c.check).join(", "))
    : "memory: ok";
}
renderHealth(); setInterval(renderHealth, 60000);

let AGENTS={};

async function loadBoard(){
  let d; try{ d=await (await fetch("board.json?_="+Date.now())).json(); }
  catch{ document.getElementById("cols").innerHTML="<div class='empty'>board.json not reachable</div>"; return; }
  AGENTS=d.agents||{};
  if(d.project){ document.getElementById("title").textContent=d.project+" — Team"; document.title=d.project+" — AI-teammates"; }

  document.getElementById("cols").innerHTML=(d.columns||[]).map(col=>{
    const items=(d.tasks||[]).filter(t=>t.status===col.id);
    const cards=items.map(t=>{
      const a=AGENTS[t.agent]||{label:t.agent,colour:"#888"};
      return `<div class="card" style="border-left-color:${esc(a.colour)}">
        <div class="id">${esc(t.id)}</div>
        <div class="ttl">${esc(t.title)}</div>
        <div class="note">${esc(t.note||"")}</div>
        <span class="who"><span class="dot" style="background:${esc(a.colour)}"></span>${esc(a.label)}</span>
      </div>`;}).join("");
    return `<div class="col"><h2><span>${esc(col.label)}</span><span>${items.length}</span></h2>
            ${cards||'<div class="note" style="opacity:.5">—</div>'}</div>`;
  }).join("");

  // team tab: the roster is generated from the agent specs, with open cards counted from the board
  const count=id=>(d.tasks||[]).filter(t=>t.agent===id&&t.status!=="done").length;
  const row=(id,depth=0)=>{const a=AGENTS[id];if(!a)return"";
    const open=count(id);
    return `<div class="node" style="margin-left:${depth*30}px">
      <span class="dot" style="background:${esc(a.colour)};margin-top:6px"></span>
      <div><div class="nm">${esc(a.label)}</div><div class="rl">${esc(a.role)}</div></div>
      <div class="load">${open?open+" open":"idle"}</div></div>`;};
  // the tree comes from each agent's reports_to, so a new seat spec shows up by itself
  const kids = p => Object.keys(AGENTS)
    .filter(k => (AGENTS[k].reports_to || null) === p)
    .sort((a,b) => (AGENTS[a].label||"").localeCompare(AGENTS[b].label||""));
  const tree = (p=null, depth=0) =>
    kids(p).map(k => row(k, depth) + tree(k, depth+1)).join("");
  document.getElementById("org").innerHTML =
    tree() || "<div class='empty'>No agents found in .ai-teammates/agents</div>";

  document.getElementById("status").textContent =
    `${(d.tasks||[]).length} tasks · board updated ${d.updated}`;
}

// Rules come from rules.json, generated from config.json, the agent specs and RULES.md:
// the same sources the hooks enforce from, so this tab cannot drift from what is enforced.
async function loadRules(){
  let r; try{ r=await (await fetch("rules.json?_="+Date.now())).json(); }
  catch{ document.getElementById("rulesBody").innerHTML=
    "<div class='empty'>rules.json not reachable</div>"; return; }
  document.getElementById("rulesBody").innerHTML =
    "<div class='t' style='margin-bottom:14px'>standing rules · updated "+esc(r.updated)+"</div>"
    + (r.groups||[]).map(g=>
      `<div class="rule ${esc(g.cls||"")}"><h3>${esc(g.h)}</h3><ul>`
      + (g.li||[]).map(x=>`<li>${x}</li>`).join("") + `</ul></div>`).join("");
}

// Every tool call, guard block and override, from the hooks' event log.
async function loadActivity(){
  let text; try{ text=await (await fetch("events.jsonl?_="+Date.now())).text(); }catch{ return; }
  const ev=text.trim().split("\n").filter(Boolean).map(l=>{try{return JSON.parse(l)}catch{return null}}).filter(Boolean);
  document.getElementById("rows").innerHTML = ev.slice(-80).reverse().map(e=>{
    let act,cls="";
    if(e.kind==="blocked"){act="BLOCKED · "+esc(e.rule);cls="blocked";}
    else if(e.kind==="override"){act="OVERRIDE · "+esc(e.tool||e.rule||"");cls="override";}
    else if(e.kind==="ask"){act="ASKED · "+esc(e.rule);cls="override";}
    else act=esc(e.tool||"");
    return `<tr><td class="t">${ago(e.ts)}</td><td>${esc(e.agent||"main")}</td>
            <td class="${cls}">${act}</td>
            <td style="color:var(--muted)">${esc(e.message||e.reason||e.target||"").slice(0,90)}</td></tr>`;
  }).join("") || '<tr><td colspan="4" class="empty">No events yet.</td></tr>';
}

function tick(){ loadBoard(); loadActivity(); loadRules(); }
tick(); setInterval(tick, 5000);
</script>
</body>
</html>
